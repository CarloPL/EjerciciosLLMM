<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <header>
        <figure>
            <img src="/imagenes/logo.png" width="150" height="150" alt="logo Augustóbriga">
            <figcaption>Fig.1 Logo IES Augustóbriga</figcaption>
        </figure>
    </header>
        <nav>
        <a href="#noticias">Noticias</a>
        <a href="#actividades">| Actividades</a>
        <a href="contactos/formcontacto.html" target="_blank" title="Contacto">| Contacto</a>
        <a href="/index.html" target="_self" title="Inicio">| Inicio</a>
    </nav>
    <main>
        <section id="contacto">
            <form action="procesar.php" method="post">
                <fieldset>
                    <legend>Formulario de Contacto</legend>
                    <label for="nombre">Nombre:</label>
                    <input type="text" name="nombre" id="nombre" required>
                    <label for="correo">Correo:</label>
                    <input type="email" name="correo" id="correo" required>
                    <label for="telf">Teléfono:</label>
                    <input type="tel" name="telf" id="telf">
                    <label for="fecha">Fecha de Visita:</label>
                    <input type="date" name="fecha" id="fecha">
                    <label for="motivo">Motivo:</label>
                    <select name="motivo" id="motivo">
                        <option value="info">Información</option>
                        <option value="matricula">Matricula</option>
                        <option value="otros">Otros</option>
                    </select>
                    <label for="mensaje">Mensaje:</label>
                    <textarea name="mensaje" id="mensaje" rows="4" cols="40"></textarea>
                    <button type="submit">Enviar</button>
                    <button type="reset">Reiniciar</button>
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
